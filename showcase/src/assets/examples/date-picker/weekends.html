<mat-form-field>
	<mat-label>Choose a date</mat-label>
	<input matInput
		   id="picker-ng-model"
		   name="picker-ng-model"
		   [value]="currentDate"
		   [min]="minDate"
		   [max]="maxDate"
		   required
		   [starkDateMask]="maskConfig"
		   (dateChange)="onDateChanged($event)"
		   [matDatepicker]="datepickerOnlyWeekend"
		   starkDatePickerFilter="OnlyWeekends"
	>
	<mat-hint>{{ maskConfig.format }}</mat-hint>
	<mat-datepicker #datepickerOnlyWeekend></mat-datepicker>
	<mat-datepicker-toggle matIconSuffix [for]="datepickerOnlyWeekend"></mat-datepicker-toggle>
</mat-form-field>
