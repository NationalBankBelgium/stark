<mat-form-field>
	<mat-label>Choose a date</mat-label>
	<input matInput
		   id="picker-custom-filter"
		   name="custom-filter"
		   [value]="currentDate"
		   [min]="minDate"
		   [max]="maxDate"
		   [starkDatePickerFilter]="customDateFilter"
		   starkDateMask
		   (dateChange)="onDateChanged($event)"
		   [matDatepicker]="datepickerCustomFilter"
	>
	<mat-hint>{{ maskConfig.format }}</mat-hint>
	<mat-datepicker #datepickerCustomFilter></mat-datepicker>
	<mat-datepicker-toggle matIconSuffix [for]="datepickerCustomFilter"></mat-datepicker-toggle>
</mat-form-field>
