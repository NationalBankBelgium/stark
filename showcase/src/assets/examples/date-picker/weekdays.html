<mat-form-field>
	<mat-label>Choose a date</mat-label>
	<input matInput
		   id="picker-only-weekdays"
		   name="only-weekdays"
		   [value]="currentDate"
		   [min]="minDate"
		   [max]="maxDate"
		   starkDatePickerFilter="OnlyWeekdays"
		   starkDateMask
		   (dateChange)="onDateChanged($event)"
		   [matDatepicker]="datepickerOnlyWeekdays"
	>
	<mat-hint>{{ maskConfig.format }}</mat-hint>
	<mat-datepicker #datepickerOnlyWeekdays></mat-datepicker>
	<mat-datepicker-toggle matIconSuffix [for]="datepickerOnlyWeekdays"></mat-datepicker-toggle>
</mat-form-field>
